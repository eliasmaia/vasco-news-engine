name: Vasco News Bot

on:
  schedule:
    # Roda a cada 30 minutos (você pode ajustar no padrão cron)
    - cron: '*/30 * * * *'
  # Permite disparar manualmente na aba "Actions" do GitHub se quiser testar
  workflow_dispatch:

jobs:
  run-bot:
  # Usa a imagem oficial do Ubuntu com Go pré-instalado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # ou a versão do seu go.mod

      - name: Executar o Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          go run main.go